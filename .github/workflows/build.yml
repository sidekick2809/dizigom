name: Build

permissions:
  contents: write

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Plugins
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          find . -name '*.cs3' -path '*/build/*' -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          cp repo.json $GITHUB_WORKSPACE/builds/repo.json
          # jsDelivr mirror for networks where raw.githubusercontent.com is blocked
          sed 's#https://raw.githubusercontent.com/sidekick2809/dizigom/builds/#https://cdn.jsdelivr.net/gh/sidekick2809/dizigom@builds/#g' build/plugins.json > $GITHUB_WORKSPACE/builds/plugins-jsdelivr.json
          cp repo-jsdelivr.json $GITHUB_WORKSPACE/builds/repo-jsdelivr.json

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force

      - name: Purge jsDelivr cache
        run: |
          curl -sS https://purge.jsdelivr.net/gh/sidekick2809/dizigom@builds/plugins-jsdelivr.json > /dev/null || true
          for f in $GITHUB_WORKSPACE/builds/*.cs3; do
            curl -sS "https://purge.jsdelivr.net/gh/sidekick2809/dizigom@builds/$(basename "$f")" > /dev/null || true
          done
          curl -sS https://purge.jsdelivr.net/gh/sidekick2809/dizigom@main/repo-jsdelivr.json > /dev/null || true
